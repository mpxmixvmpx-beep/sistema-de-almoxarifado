 <h1>ADICIONAR E RETIRAR</h1>
<form action="">
<div class="linha_de_adicao">

    <input type="text" id="nome1" placeholder="Nome">
    <input type="number" id="qtd1" placeholder="Qtd">
    <input type="number" id="preco1" placeholder="Preço">
    <input type="text" id="situacao1" placeholder="Situação">
    <input type="text" id="imagem1" placeholder="Imagem">

<!-- botoes para add e ret item-->
 
    <button onclick="adicionar()">Adicionar</button>
 </form>
    <button onclick="rem()">Retirar</button>
</div>
<table id="tabela">
        <tr>
            <th>Código:</th>
            <th>Nome:</th>
            <th>Qtd:</th>
            <th>Preço:</th>
            <th>Status:</th>
            <th>Imagem:</th>
        </tr>
        {% for item in resultado %}
            <tr>
                <th>{{item[0]}}</th>
                <th>{{item[1]}}</th>
                <th>{{item[2]}}</th>
                <th>{{item[3]}}</th>
                <th>{{item[4]}}</th>
                <th>{{item[5]}}</th>
            </tr>
        {% endfor %}
    </table>
