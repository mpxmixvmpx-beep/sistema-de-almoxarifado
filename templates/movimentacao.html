<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movimentação</title>
<link rel="stylesheet" href="{{ url_for('static', filename='movimentacao.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
</head>
<body>

<div class="container">
<div class="navbar">
    <a href="/home">
        <button><b>?</b></button></a>
    <a href="/movimentacao">
        <button class="active"><b>MOVIMENTAÇÃO</b></button></a>
    <a href="/cadastro">
        <button><b>CADASTRO</b></button></a>
    <a href="/estoque">
        <button><b>ESTOQUE</b></button></a>
    <a href="/">
        <button><b>FECHAR</b></button></a>
    <!-- MODIFICADO: link ADM visivel somente para administradores. -->
    {% if session.get('tipo') == 'admin' %}
    <a href="/adm">
        <button><b>ADM</b></button></a>
    {% endif %}
</div>
    <div class="senailogo-container">
        <img src="{{ url_for('static', filename='imagens/senailogo.png') }}" alt="SENAI" class="senailogo">
    </div>
    </div>

<h1 class="titulo_pagina">ADICIONAR E RETIRAR ITENS</h1>
<div id="form_cadastro" class="area_formulario">
    
<form action="/movimentacao_concluida" method="POST" class="formulario_cadastro" novalidate>

    <div class="linha_campo">
        <label class="rotulo_campo">Tipo:</label>
        <select class="entrada_campo" name="selecao" required>
            <option value="" selected disabled>Selecione o tipo de movimentação</option>
            <option value="1">Entrada</option>
            <option value="2">Saída</option>
        </select>
    </div>

    <div class="linha_campo">
        <label class="rotulo_campo" for="nome">Nome do Item:</label>
        <input type="text" class="entrada_campo" id="nome" placeholder="Nome" name="nome" required>
    </div>

    <div class="linha_campo">
        <label class="rotulo_campo" for="qtd">Quantidade:</label>
        <input type="number" class="entrada_campo" id="qtd" placeholder="Quantidade" name="qtd" min="1" required>
    </div>

    <button type="submit" class="botao_cadastrar">Movimentar</button>
</form>
</div>

<div class="historico-box">
    <h2>Histórico de movimentação</h2>
    <table class="tabela-historico">
        <tr>
            <th>Item</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Data</th>
        </tr>
        {% for item in historico %}
        <tr>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
            <td>{{ item[4].strftime('%d/%m/%Y %H:%M') if item[4] else '-' }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
