<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login_incorreto.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>

    
</head>
<body>
        <img src="{{ url_for('static', filename='imagens/rogerio.png') }}" alt="Imagem de login" class="imagem">
        <form id="form_login" action="/estoque" method="post">
        <div class="barra-de-login">
            <h1 class="titulo"><b>SISTEMA <br>DE<br>ALMOXARIFADO</b></h1>
            <div class="usuario">
                <label for="usuario"><b>Usuário:</b></label>
                <input id="usuario" type="text" name="nome">
            </div>
            <div class="senha">
                <label for="senha"><b>Senha:</b></label>
                <input id="senha" type="password" name="senha">
            </div>

            <b class="erro">Credenciais inválidas, tente novamente.</b>            
            <button type="submit" class="entrar"><b>ENTRAR</b></button>
        </div>
        </form>
</body>
</html>
