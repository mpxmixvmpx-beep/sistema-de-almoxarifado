<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro não concluído</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro_concluido.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
</head>
<body>
<div class="container">
    <div class="navbar">
        <a href="/home"><button><b>?</b></button></a>
        <a href="/movimentacao"><button><b>MOVIMENTAÇÃO</b></button></a>
        <a href="/cadastro"><button class="active"><b>CADASTRO</b></button></a>
        <a href="/estoque"><button><b>ESTOQUE</b></button></a>
        <a href="/"><button><b>FECHAR</b></button></a>
        {% if session.get('tipo') == 'admin' %}
        <a href="/adm"><button><b>ADM</b></button></a>
        {% endif %}
    </div>
    <div class="senailogo-container">
        <img src="{{ url_for('static', filename='imagens/senailogo.png') }}" alt="SENAI" class="senailogo">
    </div>
</div>
<h1 class="titulo_pagina">ERRO</h1>
<div class="area_conclusao">
    <p class="texto_conclusao">{{ mensagem_erro }}</p>
    <img src="{{ url_for('static', filename='imagens/rogerbracocruzado.png') }}" class="imagem_conclusao" alt="Cadastro não concluído">
    <a href="/cadastro" class="botao_adicionar">Voltar</a>
</div>
</body>
</html>
